# [ALL] Local dev: postgres + api + agent-service + web. TODO: finalise in integration.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: logiflow
      POSTGRES_PASSWORD: logiflow
      POSTGRES_DB: logiflow
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
volumes:
  pgdata:
