name: logiflow_mobile
description: LogiFlow mobile client (Flutter + Riverpod) — Android-first, all roles.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.5.1
  # HTTP client (talks to the same ASP.NET Core API as the web app)
  dio: ^5.6.0
  # JWT persistence
  flutter_secure_storage: ^9.2.2
  # Navigation (role-based routing)
  go_router: ^14.2.0
  # Date/number formatting
  intl: ^0.19.0
  # Warehouse package intake QR/barcode scanner.
  mobile_scanner: ^5.1.1

  # --- Driver-feature deps (uncomment when building those screens; each needs
  #     platform permissions in android/app/src/main/AndroidManifest.xml) ---
  # image_picker: ^1.1.2        # POD photo
  # geolocator: ^12.0.0         # GPS for live location
  # flutter_map: ^7.0.2         # route map (OSM tiles, free)
  # latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
